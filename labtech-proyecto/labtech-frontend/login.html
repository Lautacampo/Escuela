<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión | Tomás Baras</title>
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
    <main class="login-pagina">
        <section class="login-contenedor" aria-labelledby="titulo-login">
            <div class="login-presentacion">
                <div class="login-imagen-sistema">
                    <img src="imagenes/logo-tomas-baras.png" alt="Foto del sistema">
                </div>
                <h1>Colegio N° 3<br>Tomás Baras</h1>
                <p>Accedé al sistema de gestión académica de la institución.</p>
            </div>

            <div class="login-formulario">
                <h2 id="titulo-login">Iniciar sesión</h2>
                <p class="login-subtitulo">Ingresá tus datos para continuar.</p>

                <form action="gestion.html" method="get">
                    <div class="login-campo">
                        <label for="mail">Correo</label>
                        <input type="email" id="mail" name="mail" placeholder="ejemplo@gmail.com" required>
                    </div>

                    <div class="login-campo">
                        <label for="contrasena">Contraseña</label>
                        <input type="password" id="contrasena" name="contrasena" placeholder="Ingresá tu contraseña" autocomplete="current-password" required>
                    </div>


                    <button class="login-boton" type="submit">Ingresar al sistema</button>
                </form>

                <p class="login-ayuda">Si no podés ingresar, comunicate con la administración.</p>
            </div>
        </section>
    </main>
</body>
</html>
