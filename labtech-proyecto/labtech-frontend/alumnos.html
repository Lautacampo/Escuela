<!DOCTYPE html>

<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Alumnos - Sistema de Gestión Académica</title>
</head>

<body>

    <header>
        <h1>Gestión de Alumnos</h1>
    </header>


    <nav>
        <ul>
            <li>
                <a href="index.html">Inicio</a>
            </li>

            <li>
                <a href="alumnos.html">Alumnos</a>
            </li>

            <li>
                <a href="asistencia.html">Asistencia</a>
            </li>

            <li>
                <a href="calificaciones.html">Calificaciones</a>
            </li>
        </ul>
    </nav>


    <main>

        <section>

            <h2>Registrar alumno</h2>

        <form action="#" method="post">

        <p>
            <label for="nombre">
                Nombre:
            </label>

            <input
                type="text"
                id="nombre"
                name="nombre"
                required
            >
        </p>


        <p>
            <label for="apellido">
                Apellido:
            </label>

            <input
                type="text"
                id="apellido"
                name="apellido"
                required
            >
        </p>


        <p>
            <label for="dni">
                DNI:
            </label>

            <input
                type="number"
                id="dni"
                name="dni"
                min="1000000"
                max="99999999"
                required
            >
        </p>


        <p>
            <label for="email">
                Correo electrónico:
            </label>

            <input
                type="email"
                id="email"
                name="email"
                required
            >
        </p>


        <p>
            <label for="fechaNacimiento">
                Fecha de nacimiento:
            </label>

            <input
                type="date"
                id="fechaNacimiento"
                name="fechaNacimiento"
                min="1900-01-01"
                max="2008-12-31"
                required
            >
        </p>


        <p>
            <label for="curso">
                Curso:
            </label>

            <select
                id="curso"
                name="curso"
                required
            >

                <option value="">
                    Seleccione un curso
                </option>

                <option value="primero">
                    Primer año
                </option>

                <option value="segundo">
                    Segundo año
                </option>

                <option value="tercero">
                    Tercer año
                </option>

            </select>
        </p>


        <p>
            <label for="observaciones">
                Observaciones:
            </label>
        </p>

        <p>
            <textarea
                id="observaciones"
                name="observaciones"
                rows="5"
                cols="40"
            ></textarea>
        </p>


        <p>
            <button type="submit">
                Registrar alumno
            </button>

            <button type="reset">
                Limpiar formulario
            </button>
        </p>

    </form>

        </section>

    </main>


    <footer>

        <p>
            <a href="index.html">
                Volver a la página principal
            </a>
        </p>

        <p>Laboratorio de Tecnologías 2026</p>

    </footer>

</body>

</html>
